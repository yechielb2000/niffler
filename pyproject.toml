[project]
name = "niffler"
version = "0.1.0"
description = "Local system inventory viewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "psycopg[binary]>=3.3.4",
    "paramiko>=3.0.0",
    "remote-machine @ git+https://github.com/yechielb2000/remote-machine.git",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
per-file-ignores = { "backend/routes/*.py" = ["B008"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["backend", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
